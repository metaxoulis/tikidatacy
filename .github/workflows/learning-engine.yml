name: Tiki-Data Learning Engine — QA retraining
on:
  push:
    branches: ['feature/learning-engine-v1']
    paths:
      - 'learning_engine/**'
      - 'tests/test_learning_engine.py'
      - '.github/workflows/learning-engine.yml'
  pull_request:
    paths:
      - 'learning_engine/**'
      - 'tests/test_learning_engine.py'
      - '.github/workflows/learning-engine.yml'
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests — leakage and sanity gates
        run: python -m unittest discover -s tests -p test_learning_engine.py -v
      - name: Fetch CC0 sources and retrain QA candidate
        run: python -m learning_engine.pipeline --output learning-engine-output
      - name: Store model candidate and reproducible QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-engine-audit-${{ github.run_id }}
          path: learning-engine-output/
          if-no-files-found: warn
          retention-days: 30
