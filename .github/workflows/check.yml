name: Tiki-Data preview checks
on:
  push:
    branches: ['development/**', 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all present JavaScript sources
        run: |
          count=0
          while IFS= read -r -d '' js; do
            echo "Checking $js"
            node --check "$js"
            count=$((count + 1))
          done < <(find . -type f -name '*.js' ! -path './node_modules/*' -print0)
          echo "Checked $count JavaScript files"
      - name: Test SportAPI fallback normalization and key safety
        run: node --test tests/*.test.mjs
      - name: Test isolated StatsBomb research parser (offline)
        run: python3 -m unittest discover -s research/statsbomb -p 'test_*.py'
      - name: Run existing JavaScript model tests if present
        run: |
          if test -f test_model.js; then
            node test_model.js
          else
            echo "No root JS model test; Python Learning Engine is verified by a separate workflow."
          fi
      - name: Build legacy preview only when its files are present
        run: |
          if test -f bundle.py; then
            python3 bundle.py
            if test -f _worker.js; then node --check _worker.js; fi
          else
            echo "Legacy preview bundler not present in this branch; skipped."
          fi
