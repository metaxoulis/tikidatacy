name: Tiki-Data preview checks
on:
  push:
    branches: ['development/**', 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate available development sources
        shell: bash
        run: |
          if [[ -f app.js && -f worker-base.js && -f model.js ]]; then
            node --check app.js
            node --check worker-base.js
            node --check model.js
            if [[ -f test_model.js ]]; then node test_model.js; fi
          else
            echo "Legacy frontend files not yet versioned on this branch; checking committed premium sources."
          fi
      - name: Build premium preview from GitHub sources
        run: |
          node --check premium/premium-icons.js
          node --check premium/worker-template.js
          python3 premium/build.py
          node --check premium/_worker.js
